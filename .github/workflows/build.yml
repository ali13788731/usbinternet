name: Build APK and Windows app

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build APK (release-signed when the keystore secrets exist, otherwise debug)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
          SKU_MONTHLY: ${{ vars.SKU_MONTHLY }}
          SKU_YEARLY: ${{ vars.SKU_YEARLY }}
          PC_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/latest/CableNet-Setup.exe
        run: |
          chmod +x gradlew
          # Maven Central sometimes answers HTTP 429 (too many requests) on shared runners: retry the build.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "Build failed (try $i), waiting before retry..."; sleep $((i * 40)); done; return 1; }
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            retry ./gradlew assembleRelease
            cp app/build/outputs/apk/release/*.apk CableNet.apk
          else
            retry ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk CableNet.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CableNet-apk
          path: CableNet.apk

  windows:
    needs: android
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CableNet-apk
          path: apk

      - name: Collect adb, gnirehtet and the phone app
        shell: pwsh
        run: |
          $tools = "pc/Peyvand/tools"
          New-Item -ItemType Directory -Force -Path "$tools/licenses" | Out-Null

          # adb (Android Platform Tools)
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt -Force
          foreach ($f in "adb.exe","AdbWinApi.dll","AdbWinUsbApi.dll") {
            Copy-Item "pt/platform-tools/$f" $tools
          }
          Copy-Item "pt/platform-tools/NOTICE.txt" "$tools/licenses/android-platform-tools-NOTICE.txt"

          # gnirehtet relay
          gh release download --repo Genymobile/gnirehtet --pattern "gnirehtet-rust-win64*.zip" --dir gn --clobber
          Expand-Archive (Get-ChildItem gn/*.zip | Select-Object -First 1).FullName -DestinationPath gn/x -Force
          $exe = Get-ChildItem gn/x -Recurse -Filter gnirehtet.exe | Select-Object -First 1
          Copy-Item $exe.FullName $tools
          $lic = Get-ChildItem gn/x -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$tools/licenses/gnirehtet-LICENSE.txt" }

          # phone app + its version code
          Copy-Item apk/CableNet.apk "$tools/app.apk"
          $gradle = Get-Content app/build.gradle.kts -Raw
          if ($gradle -match 'versionCode\s*=\s*(\d+)') { Set-Content "$tools/app.version" $Matches[1] -NoNewline }

          foreach ($f in "adb.exe","gnirehtet.exe","app.apk") {
            if (-not (Test-Path "$tools/$f")) { throw "missing $f" }
          }
          Get-ChildItem $tools -Recurse | Select-Object FullName, Length

      - name: Build Windows app (.NET Framework 4.8, tiny exe)
        run: dotnet build pc/Peyvand/Peyvand.csproj -c Release -o pc/publish

      - name: Add tools next to the exe
        shell: pwsh
        run: |
          Copy-Item pc/Peyvand/tools pc/publish/tools -Recurse
          Get-ChildItem pc/publish -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "Total MB: " + [math]::Round($_.Sum/1MB,1) }

      - uses: actions/upload-artifact@v4
        with:
          name: CableNet-Windows-portable
          path: pc/publish

      - name: Build installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" pc/installer/Peyvand.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CableNet-Windows-Setup
          path: pc/installer/Output/*.exe
          if-no-files-found: warn

  release:
    needs: windows
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CableNet-Windows-Setup
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: CableNet-apk
          path: out
      # Rolling release: the Windows installer always lives at the same link, so Brand.PC_DOWNLOAD_URL never changes:
      # https://github.com/<user>/<repo>/releases/download/latest/CableNet-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: out/*
